      en: Remote Crystal Energy Work
    minutes: 20
    price: 28000
    description:
      ja: |-
        透きとおる結晶（クリスタル）のように、純度の高いあなた特有の振動（固有振動数）にアプローチするオーダーメイドエネルギーワーク
        ＋テキストメッセージにて見えたビジョンや感じたことをお伝えします💎

        ・身体やオーラ体に溜まったノイズ（余分な情報・感情）をクリアにろ過
        ・クリスタルのような透明度へ
