        A bespoke energy-healing session designed to resonate with your unique, high-purity vibration—much like a clear, crystalline structure.
        + You will receive a text message detailing the visions perceived and insights felt during the session. 💎

        ・Clears away the "noise" (excess information and emotions) accumulated within your physical body and aura.
        ・Restores a state of crystalline clarity
    booking_url: https://calendar.google.com/calendar/appointments/schedules/AcZssZ2PR8xK9N52UH2CqyWcJDG9ObOAFayMITk9GUgpOVKn_qGsBizIjGyUhL9VEst-cQ-_k-ft7dLU
  - name:
      ja: 遠隔DNAアクティベーション
      en: Remote DNA Activation
    minutes: 10
    price: 28000
    description:
      ja: |-
        下記の１テーマごとの金額になります
        (２テーマ以上は２テーマ以降16,000円)

        1.情熱を活性化したい方
        2.精神的豊かさ、物質的豊かさを定着させたい方
        3.生きる喜びを感じたい方
        4.奇跡の日常を体感したい方
        5.うちなる情報をダウンロードしたい方
      en: |-
        The prices below are per theme.
        (For two or more themes, the cost for each additional theme is 16,000 yen.)

        1.Those who wish to ignite their passion
        2.Those who wish to anchor both spiritual and material abundance in their lives
        3.Those who wish to experience the joy of living
        4.Those who wish to live a life filled with everyday miracles
        5.Those who wish to access and download the wisdom from within
    booking_url: https://calendar.google.com/calendar/appointments/schedules/AcZssZ2PR8xK9N52UH2CqyWcJDG9ObOAFayMITk9GUgpOVKn_qGsBizIjGyUhL9VEst-cQ-_k-ft7dLU
  - name:
      ja: Session
      en: Session
    minutes: 60
    price: 28000
    description:
      ja: |-
        じぶんが世界に合わせるのではなく
        世界がじぶんに合わせてくる
        純粋な”響き”で生きる

        ”ただ在る”ことでつながる
        じぶんの絶対安心領域、体感を


        お話ししたいだけの方も
        大歓迎です
      en: |-
        Rather than conforming yourself to the world,
        let the world align with you—
        by living in a state of pure "resonance."

        Connect simply by "just being"—
        discover your own space of absolute inner peace and the physical sensation of it.

        If you’d just like to have a chat,
        you are more than welcome!
    booking_url: https://calendar.google.com/calendar/appointments/schedules/AcZssZ2PR8xK9N52UH2CqyWcJDG9ObOAFayMITk9GUgpOVKn_qGsBizIjGyUhL9VEst-cQ-_k-ft7dLU
