title:
  ja: プライバシーポリシー
  en: Privacy policy
body:
  ja: |-
    HAKU（以下「当サロン」）は、お客様の個人情報を次のとおり取り扱います。

    ## 取得する情報

    ご予約の際に、お名前、メールアドレス、電話番号、ご予約の日時、予約フォームにご記入いただいた内容をお預かりします。

    ## 利用目的

    - ご予約の受付・確認・変更・キャンセルのご連絡
    - セッションのご案内と、お問い合わせへの回答

    上記以外の目的には使用しません。

    ## 第三者への提供

    法令に基づく場合を除き、ご本人の同意なく第三者に提供することはありません。

    ## 外部サービスの利用

    ご予約の受付には Google カレンダー（Google LLC）を利用しており、ご予約の情報は Google のサーバーに保存されます。詳しくは [Google のプライバシーポリシー](https://policies.google.com/privacy) をご覧ください。

    当サイトは Cloudflare と GitHub Pages を利用して配信しており、これらのサービスが閲覧時の技術情報（IPアドレスなど）を処理することがあります。

    ## アクセス解析・Cookie

    当サイトはアクセス解析を行っていません。表示言語の選択のみ、お使いのブラウザに保存します。

    ## 開示・訂正・削除

    ご自身の情報の開示・訂正・削除をご希望の場合は、下記までご連絡ください。

    ## お問い合わせ

    Instagram のDM、またはご予約確認メールへのご返信でご連絡ください。

    制定日：2026年10月22日
  en: |-
    HAKU ("the salon") handles your personal information as follows.

    ## What we collect

    When you book, we receive your name, email address, phone number, the date and time of your booking, and anything you write in the booking form.

    ## How we use it

    - To accept, confirm, change or cancel your booking
    - To tell you about your session and answer your questions

    We do not use it for anything else.

    ## Sharing

    We do not share your information with anyone without your consent, except where the law requires it.

    ## Services we use

    Bookings are handled by Google Calendar (Google LLC), so booking details are stored on Google's servers. See [Google's privacy policy](https://policies.google.com/privacy).

    This site is served through Cloudflare and GitHub Pages, which may process technical information such as your IP address when you visit.

    ## Analytics and cookies

    This site does not use analytics. It only stores your language choice in your browser.

    ## Your information

    To see, correct or delete your information, please contact us as below.

    ## Contact

    Send us a DM on Instagram, or reply to your booking confirmation email.

    Effective: 22 October 2026
