<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title data-i18n="s.title"></title>
    <meta name="description" data-i18n-content="s.desc" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Shippori+Mincho:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="light" data-theme="light" data-visual="dust" data-shape="merkaba">
    <header class="nav">
      <a class="brand" href="#top">HAKU</a>
      <nav aria-label="Main">
        <a href="#about" data-i18n="s.nav.about">About</a>
        <a href="#menu" data-i18n="s.nav.menu">Menu</a>
        <a href="#visit" data-i18n="s.nav.visit">First visit</a>
        <a href="./blog/" data-i18n="s.nav.blog">Blog</a>
        <a href="#access" data-i18n="s.nav.access">Access</a>
      </nav>
      <button class="lang-toggle" type="button" data-lang-toggle data-i18n="lang.switch">日本語</button>
      <a class="btn btn--solid btn--small" href="#book" data-i18n="s.nav.book">Book</a>
    </header>

    <main id="top">
      <section class="hero">
        <p class="eyebrow" data-i18n="s.eyebrow"></p>
        <h1 data-i18n-html="s.h1"></h1>
        <p class="lede" data-i18n="s.lede"></p>
        <div class="actions">
          <a class="btn btn--solid" href="#book" data-orb><span data-i18n="s.cta"></span> <span aria-hidden="true">→</span></a>
          <a class="btn btn--ghost" href="#menu" data-i18n="s.viewMenu"></a>
        </div>
        <p class="breath" aria-live="off"><span class="breath-dot" aria-hidden="true"></span><span data-breath data-i18n="breath.slow">Breathe slowly</span></p>
      </section>

      <section id="about" class="section split">
        <div>
          <p class="eyebrow" data-i18n="s.about.eyebrow"></p>
          <h2 data-i18n-html="s.about.h2"></h2>
        </div>
        <p class="body-copy" data-i18n="s.about.p"></p>
      </section>

      <section id="menu" class="section">
        <p class="eyebrow" data-i18n="s.menu.eyebrow"></p>
        <h2 data-i18n-html="s.menu.h2"></h2>
        <ul class="menu">
<!-- salon:menu -->
        </ul>
        <!-- salon:menu-note -->
      </section>

      <section id="visit" class="section">
        <p class="eyebrow" data-i18n="s.visit.eyebrow"></p>
        <h2 data-i18n-html="s.visit.h2"></h2>
        <div class="cards">
<!-- home:visit -->
        </div>
      </section>

      <section class="section faq">
        <p class="eyebrow" data-i18n="s.faq.eyebrow"></p>
<!-- home:faq -->
      </section>

      <section id="access" class="section split">
        <div>
          <p class="eyebrow" data-i18n="s.access.eyebrow"></p>
          <h2 data-i18n-html="s.access.h2"></h2>
        </div>
        <dl class="info">
<!-- salon:info -->
        </dl>
      </section>

      <section id="book" class="section section--cta">
        <blockquote data-i18n-html="s.quote"></blockquote>
        <p class="eyebrow" data-i18n="s.cta"></p>
        <ul class="book-list">
<!-- salon:booking -->
        </ul>
        <div class="book-notes">
          <!-- salon:booking-notes -->
        </div>
      </section>
    </main>

    <!-- Desktop: Google's booking page in a panel (booking.js). Phones open it in a new tab. -->
    <dialog class="booking" data-booking aria-labelledby="booking-title">
      <div class="booking-head">
        <h2 id="booking-title" class="booking-title"></h2>
        <a class="booking-link" target="_blank" rel="noopener" data-booking-tab data-i18n="s.book.newTab">Open in new tab ↗</a>
        <button class="lang-toggle" type="button" data-booking-close data-i18n="s.book.close">Close</button>
      </div>
      <iframe title="Booking calendar" data-booking-frame></iframe>
    </dialog>

    <footer class="footer" data-i18n-html="s.footer"></footer>

    <script type="module" src="/i18n.js"></script>
    <script type="module" src="/entry.js"></script>
    <script type="module" src="/booking.js"></script>
  </body>
</html>
