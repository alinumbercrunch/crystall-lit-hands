# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.224.0/schema/sveltia-cms.json
# Site editor at /admin/. Saving commits to main, which deploys the site.
# Blog layout must match scripts/blog.js: posts/<slug>/index.<locale>.md
# Salon info layout must match scripts/salon.js: content/salon.yml

backend:
  name: github
  repo: alinumbercrunch/crystall-lit-hands
  branch: main
  # Sign-in is Cloudflare Access; worker/ answers the sign-in popup and forwards
  # GitHub API calls with its own token (REQUIREMENTS.md). Values must match worker/wrangler.toml.
  base_url: https://ayakahaku.com
  auth_endpoint: cms/auth
  auth_methods: [oauth]
  # The CMS adds /api/v3 to any root not ending in it, and derives GraphQL as …/api/graphql.
  api_root: https://ayakahaku.com/cms/api/v3
  commit_messages:
    create: "Blog: add {{slug}}"
    update: "Content: update {{slug}}"
    delete: "Blog: delete {{slug}}"

site_url: https://ayakahaku.com/
display_url: https://ayakahaku.com/

# Images land in public/media/. The CMS requires an absolute public_folder;
# scripts/blog.js rewrites /media/… to ../media/… so it works under any base path.
media_folder: public/media
public_folder: /media

i18n:
  structure: multiple_files
  locales: [ja, en]
  default_locale: ja

collections:
  - name: posts
    label: ブログ / Blog
    label_singular: 記事 / Post
    folder: posts
    path: "{{slug}}/index"
    extension: md
    format: frontmatter
    create: true
    delete: true
    i18n: true
    # Titles may be Japanese, so the URL is date + short random id.
    slug: "{{year}}-{{month}}-{{day}}-{{uuid_shorter}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    preview_path: "blog/{{slug}}.html"
    fields:
      - label: タイトル / Title
        name: title
        widget: string
        i18n: true
      - label: 公開日 / Date
        name: date
        widget: datetime
        type: date
        default: "{{now}}"
        i18n: duplicate
      - label: 概要 / Description
        name: description
        widget: text
        i18n: true
        hint: 記事一覧と検索結果に表示される1〜2文 / 1–2 sentences shown in the list and search results
      - label: 本文 / Body
        name: body
        widget: richtext
        i18n: true
        hint: 目安は日本語で約1,600字、英語で約700語（約4分） / About 700 English words (≈4 min read)

  # Menu, booking and access on the home page. Read by scripts/salon.js; an
  # empty English field shows the Japanese text (and the other way round).
  - name: salon
    label: サロン情報 / Salon info
    files:
      - name: salon
        label: メニュー・予約・アクセス / Menu, booking & access
        file: content/salon.yml
        fields:
          - label: セッション / Sessions
            name: sessions
            widget: list
            summary: "{{fields.name.ja}} · {{fields.minutes}}分"
            hint: 並び順はサイトの表示順です / Shown on the site in this order
            fields:
              - label: 名前 / Name
                name: name
                widget: object
                fields:
                  - { label: 日本語, name: ja, widget: string }
                  - { label: English, name: en, widget: string, required: false }
              - { label: 時間（分） / Minutes, name: minutes, widget: number, value_type: int, min: 1 }
              - { label: 料金（円・税込） / Price (yen, tax incl.), name: price, widget: number, value_type: int, min: 0 }
              - label: 説明 / Description
                name: description
                widget: object
                fields: &para # 日本語 / English, multi-line
                  - { label: 日本語, name: ja, widget: text, required: false }
                  - { label: English, name: en, widget: text, required: false }
              - label: 予約リンク / Booking link
                name: booking_url
                widget: string
                required: false
                hint: >-
                  Googleカレンダーの予約スケジュール →「共有」→「ウェブサイトに埋め込む」のリンク（https://calendar.google.com/calendar/appointments/schedules/…）を貼るとページ内に表示、「予約ページのリンク」は新しいタブで開きます。空欄なら「準備中」と表示。 /
                  Google Calendar appointment schedule → Share → "Website embed" link opens on the page; the "Booking page" link opens a new tab. Leave empty to show "coming soon".
          - label: メニューの注記 / Menu note
            name: menu_note
            widget: object
            fields: &line # 日本語 / English, one line
              - { label: 日本語, name: ja, widget: string, required: false }
              - { label: English, name: en, widget: string, required: false }
          - label: アクセス情報 / Access details
            name: info
            widget: list
            summary: "{{fields.label.ja}}"
            fields:
              - label: 項目 / Label
                name: label
                widget: object
                fields:
                  - { label: 日本語, name: ja, widget: string }
                  - { label: English, name: en, widget: string, required: false }
              - label: 内容 / Value
                name: value
                widget: object
                fields:
                  - { label: 日本語, name: ja, widget: string }
                  - { label: English, name: en, widget: string, required: false }
          - label: 予約の注記（支払い・キャンセル） / Booking note (payment, cancellation)
            name: booking_note
            widget: object
            fields: *para
          - label: 個人情報の注記 / Privacy note
            name: privacy_note
            widget: object
            fields: *para

  # Headings, intro texts, first-visit steps, FAQ and footer. Read by scripts/home.js;
  # an empty English field shows the Japanese text (and the other way round).
  - name: home
    label: ホームページの文章 / Page text
    files:
      - name: home
        label: ホーム・ブログの文章 / Home & blog page text
        file: content/home.yml
        description: >-
          *ことば* で斜体、改行で改行、[文字](リンク) でリンクになります（見出し・引用・フッター）。 /
          In headings, the quote and the footer: *words* → italics, a new line → line break, [text](link) → link.
        fields:
          - label: ページ情報 / Page (browser tab & search results)
            name: page
            widget: object
            fields:
              - { label: タイトル / Title, name: title, widget: object, fields: *line }
              - { label: 説明 / Description, name: description, widget: object, fields: *para }
          - label: トップ / Hero
            name: hero
            widget: object
            fields:
              - { label: 小見出し / Eyebrow, name: eyebrow, widget: object, fields: *line }
              - { label: 見出し / Heading, name: heading, widget: object, fields: *para }
              - { label: 紹介文 / Intro, name: lede, widget: object, fields: *para }
              - { label: 予約ボタン / Book button, name: book_button, widget: object, fields: *line }
              - { label: メニューボタン / Menu button, name: menu_button, widget: object, fields: *line }
          - label: サロンについて / About
            name: about
            widget: object
            fields:
              - { label: 小見出し / Eyebrow, name: eyebrow, widget: object, fields: *line }
              - { label: 見出し / Heading, name: heading, widget: object, fields: *para }
              - { label: 本文 / Text, name: body, widget: object, fields: *para }
          - label: メニュー / Menu
            name: menu
            widget: object
            fields:
              - { label: 小見出し / Eyebrow, name: eyebrow, widget: object, fields: *line }
              - { label: 見出し / Heading, name: heading, widget: object, fields: *para }
          - label: はじめての方へ / First visit
            name: visit
            widget: object
            fields:
              - { label: 小見出し / Eyebrow, name: eyebrow, widget: object, fields: *line }
              - { label: 見出し / Heading, name: heading, widget: object, fields: *para }
              - label: ステップ / Steps
                name: steps
                widget: list
                summary: "{{fields.title.ja}}"
                fields:
                  - { label: タイトル / Title, name: title, widget: object, fields: *line }
                  - { label: 本文 / Text, name: body, widget: object, fields: *para }
          - label: よくある質問 / FAQ
            name: faq
            widget: object
            fields:
              - { label: 小見出し / Eyebrow, name: eyebrow, widget: object, fields: *line }
              - label: 質問 / Questions
                name: items
                widget: list
                summary: "{{fields.question.ja}}"
                fields:
                  - { label: 質問 / Question, name: question, widget: object, fields: *line }
                  - { label: 回答 / Answer, name: answer, widget: object, fields: *para }
          - label: アクセス / Access
            name: access
            widget: object
            fields:
              - { label: 小見出し / Eyebrow, name: eyebrow, widget: object, fields: *line }
              - { label: 見出し / Heading, name: heading, widget: object, fields: *para }
          - label: 予約セクションの引用 / Booking section quote
            name: closing
            widget: object
            fields:
              - { label: 引用 / Quote, name: quote, widget: object, fields: *para }
          - { label: フッター / Footer, name: footer, widget: object, fields: *para }
          - label: ブログ一覧ページ / Blog list page
            name: blog
            widget: object
            fields:
              - { label: タイトル / Title, name: title, widget: object, fields: *line }
              - { label: 説明 / Description, name: description, widget: object, fields: *para }
              - { label: 小見出し / Eyebrow, name: eyebrow, widget: object, fields: *line }
              - { label: 見出し / Heading, name: heading, widget: object, fields: *para }
              - { label: フッター / Footer, name: footer, widget: object, fields: *para }
